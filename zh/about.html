<section class="page-hero container"><p class="eyebrow">關於</p><h1 class="page-title">在觀察與實踐中<br>形成的雕刻工藝。</h1><p class="page-intro">Mr. Nine Engraving 是位於台灣的獨立工作室，專注於訂製腕錶手工雕刻。</p></section><section class="wide-image"><img src="../assets/images/about/workshop.jpg" alt="雕刻細節"></section><section class="section container editorial-grid"><p class="eyebrow">起點</p><div class="prose"><h2 class="title-lg">一件工具，一次自學。</h2><p>這門工藝是在持續觀察、反覆練習，以及對材料、力量與控制逐漸加深的理解中形成。</p><p>每種刀型都在金屬表面反覆測試，直到真正理解它的用途。</p></div></section><section class="section dark-panel"><div class="container editorial-grid"><p class="eyebrow">作品</p><div class="prose"><h2 class="title-lg">不用 CNC，不用雷射。</h2><p>每個設計只為一位收藏家而生，所有線條皆由手工刻製。</p><p>目標不只是裝飾，而是讓作品長久承載收藏家的故事與記憶。</p></div></div></section></main><footer class="site-footer"><div><a class="brand" href="index.html"><img src="../assets/images/logo-1.png" alt="Logo"></a></div><div class="footer-links"><a href="portfolio.html">作品</a><a href="commission.html">委託</a></div><div class="footer-links"><a href="mailto:bmxnine@gmail.com">Email</a></div><p>© 2026 Mr. Nine Engraving</p></footer></body></html>
